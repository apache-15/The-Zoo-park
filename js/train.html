<head>
<link rel="stylesheet" href="../js/train.css">

</head>


<body>
    <p class="header">Welcome</p>

    <input type="number" id="n1" placeholder="число 1">
    <input type="number" id="n2" placeholder="число 2">

    <select id="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <button id="calc_btn">Вычислить</button>
    
    <input id="calc_result" readonly>
    <br></br>


    <input type="text" id="name" placeholder="enter name">
    <button class = "name_btn" id="name_btn">ввести имя</button>
    <p id="hellow"></p>
    <p></p>
    <input type="number" id="day", placeholder="день">
    <input type="number" id="mon", placeholder="месяц">
    <input type="number" id="year", placeholder="год">
    <button id="date_sum">вычислить сумму</button>
    <p id="res"></p>

    <img id="result_pic" src="" width="200" alt="Результат">

    <button id="clicker">Click me</button>
    <p id="clicker_num">Нажато: 0 раз</p>
    <img id="pic" src="" width="200" alt="Рез">

    <script src="../js/train.js"></script>

    
</body>
