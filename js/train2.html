<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Название страницы</title>
    <link rel="stylesheet" href="../js/train2.css">
</head>
<body>

    <button id="select">Выбрать</button>
    <p id="user_name"></p>


    <div class="all">

        <div class="radios">
            <div class="radio1">
                <input type="radio" id="angles" name="radio"> 
                <label for="angles">Углы</label>
            </div>
            <div class="radio2">
                <input type="radio" id="sides" name="radio">
                <label for="sides">СТороны</label>
            </div>
        </div>


        <div class="list">
             <ol type="A">
                <li><input type="number" id="a"></li>
                <li><input type="number" id="b"></li>
                <li><input type="number" id="c"></li>
            </ol>
        </div>
       
        <button id="count">Определить вид треугольника</button>
        <p id="answer"></p>
        <p id="res"></p>
        
        
        
    </div>
    
    <script src="../js/train2.js"></script>

</body>
</html>
