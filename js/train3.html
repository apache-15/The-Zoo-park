<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Название страницы</title>
    <link rel="stylesheet" href="../js/train3.css">
</head>
<body>
    <!-- ДВЕ КНОПКИ С КАРТИНКАМИ -->
    <button id="moto_btn">
        <img src="../images/moto.png" alt="Мотоцикл" width="100">
    </button>
    
    <button id="car_btn">
        <img src="../images/car.png" alt="Машина" width="100">
    </button>

    <!-- ПОЛЗУНОК БЕНЗИНА -->
    <p>Выберите количество литров бензина: 
        <span id="fuel_value">50</span> л
    </p>
    <input type="range" id="fuel" min="0" max="100" value="50">

    <!-- ПОЛЕ ДЛИНЫ ПУТИ -->
    <p>Длина пути (км):</p>
    <input type="number" id="distance" placeholder="Введите км">

    <!-- ВЫВОД -->
    <p id="result"></p>
    <img id="smile" src="" alt="Смайлик">

    <script src="../js/train3.js"></script>


        

</body>
</html>
