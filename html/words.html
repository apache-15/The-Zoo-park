<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная: Слова</title>
    
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/logo.css">
    <link rel="stylesheet" href="../styles/words.css">
</head>

<body>

    <header class="header">
        <a href="../index.html" class="logo-link">
            <div class="logo-paw">
                <div class="paw-toe toe-1"></div>
                <div class="paw-toe toe-2"></div>
                <div class="paw-toe toe-3"></div>
                <div class="paw-toe toe-4"></div>
                <div class="paw-pad"></div>
            </div>
            <span class="logo-text">The ZOO</span>
        </a>
    </header>

    <div class="content">
        <h1>Разбор слов</h1>
        
        <div class="lab-container">
            
            <!-- Зона 3 -->
            <div class="zone zone-3" id="zone-3"></div>

            <div class="bottom-row">
                
                <!-- Зона 2 -->
                <div class="zone zone-2" id="zone-2"></div>

                <!-- Зона 1 -->
                <div class="zone zone-1">
                    
                    <div class="input-group">
                        <input type="text" id="word-input" class="word-input">
                        <button id="parse-btn" class="parse-btn">Разобрать</button>
                    </div>

                    <!-- Поле для вывода текста -->
                    <div class="output-box" id="output-box"></div>

                </div>
            </div>
        </div>
    </div>

    <div class="stripe stripe-bottom"></div>

    <script src="../js/words.js"></script>
</body>
</html>
